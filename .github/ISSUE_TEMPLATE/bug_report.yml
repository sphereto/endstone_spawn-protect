name: Bug Report
description: Report a problem with endstone_spawnprotect
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Run the command ...
        2. ...
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: endstone-version
    attributes:
      label: Endstone version
      placeholder: "0.11"
    validations:
      required: true
  - type: input
    id: bds-version
    attributes:
      label: Bedrock Dedicated Server version
      placeholder: "1.21.x"
  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: "3.12"
  - type: dropdown
    id: os
    attributes:
      label: Server OS
      options:
        - Windows
        - Linux
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Server log
      description: Paste the relevant log lines (they are formatted as code automatically).
      render: shell
